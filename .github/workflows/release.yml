name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.changes.outputs.build }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect non-Markdown changes in the entire push
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::invalid before SHA'; exit 1; }
          if [[ "$BEFORE" =~ ^0{40}$ ]]; then
            base="$(git hash-object -w -t tree --stdin </dev/null)"
          else
            # A force-push can make the old tip unreachable from the new one.
            if ! git cat-file -e "$BEFORE^{commit}"; then
              git fetch --no-tags origin "$BEFORE"
            fi
            git cat-file -e "$BEFORE^{commit}"
            base="$BEFORE"
          fi
          # Do not put git in a pipeline where an error can look like no changes.
          git diff --no-renames --name-only -z "$base" "$GITHUB_SHA" -- > "$RUNNER_TEMP/changed"
          python3 - "$RUNNER_TEMP/changed" >> "$GITHUB_OUTPUT" <<'PY'
          import pathlib, sys
          names = pathlib.Path(sys.argv[1]).read_bytes().split(b'\0')
          build = any(name and not name.endswith(b'.md') for name in names)
          print(f'build={str(build).lower()}')
          PY
      - name: Require release credentials and check deterministic version
        id: version
        if: steps.changes.outputs.build == 'true'
        env:
          HAVE_SECRETS: ${{ secrets.TELEGRAM_API_ID != '' && secrets.TELEGRAM_API_HASH != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HAVE_SECRETS" != true ]]; then
            echo '::error::Release requires both TELEGRAM_API_ID and TELEGRAM_API_HASH repository secrets. Without them Quill opens the synthetic demo instead of live authorization.'
            exit 1
          fi
          day="$(TZ=UTC git log -1 --format=%cd --date=format-local:'%Y.%-m%d' "$GITHUB_SHA")"
          version="$day.$(git rev-list --count "$GITHUB_SHA")"
          python3 - "$version" <<'PY'
          import datetime, re, sys
          m = re.fullmatch(r'(\d{4})\.([1-9]\d?)(\d{2})\.(0|[1-9]\d*)', sys.argv[1])
          if not m:
              sys.exit(f'::error::invalid release version {sys.argv[1]}')
          datetime.date(int(m[1]), int(m[2]), int(m[3]))
          PY
          tag="v$version"
          # ls-remote failing is an error, never evidence that a tag is absent.
          git ls-remote --refs origin "refs/tags/$tag" > "$RUNNER_TEMP/tag-ref"
          if [[ -s "$RUNNER_TEMP/tag-ref" ]]; then
            git fetch --no-tags origin "refs/tags/$tag"
            actual="$(git rev-parse 'FETCH_HEAD^{commit}')"
            [[ "$actual" == "$GITHUB_SHA" ]] || { echo "::error::$tag already points to $actual, not $GITHUB_SHA"; exit 1; }
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  linux-checks:
    name: Linux fmt, clippy and tests
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test Flatpak manifest preparation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s packaging/flatpak -p 'test_bump.py'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (core)
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
      - name: tests (core + replay)
        timeout-minutes: 30
        run: cargo test --no-default-features --locked -- --nocapture
      - name: tests (network watcher, Linux namespace)
        timeout-minutes: 10
        run: |
          key=kernel.apparmor_restrict_unprivileged_userns
          if sysctl -n "$key" >/dev/null 2>&1; then sudo sysctl -w "$key=0"; fi
          cargo test --no-default-features --locked --lib net_watch -- --ignored --nocapture
      - name: apt dependencies (UI build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config nasm \
            zlib1g-dev libssl-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libxcb-xkb-dev libfontconfig-dev \
            libfreetype-dev libasound2-dev libvulkan-dev libdbus-1-dev libclang-dev dbus
      - name: tests (UI, headless)
        run: cargo test --features demo-capture --locked --bin quill
      - name: tests (UI library, vendored Linux backend)
        run: >-
          cargo test -p gpui-pre-linux -p quill --lib --features quill/demo-capture --locked --
          battery_signal tray_sni present_retry recovery_timers wayland::client::tests wayland::clipboard::tests
      - name: clippy (UI)
        run: cargo clippy --features demo-capture --all-targets --locked -p quill -p quill-calls-sys -p quill-webview-protocol -- -D warnings

  # Build and test the call library once per shipped target. The package jobs
  # consume the exact library tested here, instead of building it a second time.
  calls:
    name: quill-calls (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-22.04, lib: libquill_calls.so }
          - { target: linux-aarch64, runner: ubuntu-22.04-arm, lib: libquill_calls.so }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config nasm yasm \
            zlib1g-dev libssl-dev libpulse-dev libasound2-dev \
            libx11-dev libxcomposite-dev libxdamage-dev libxext-dev libxfixes-dev \
            libxrandr-dev libxrender-dev libxtst-dev libdrm-dev libgbm-dev \
            libepoxy-dev libglib2.0-dev libpipewire-0.3-dev
      - name: restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: vendor/ffmpeg/prefix
          key: ffmpeg-linux-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'native/quillvideo/*') }}
      - name: build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh
      - name: save FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/ffmpeg/prefix
          key: ffmpeg-linux-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'native/quillvideo/*') }}
      - name: restore tg_owt and codecs
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: vendor/quill-calls/work/deps
          key: quill-calls-deps-${{ matrix.target }}-${{ hashFiles('scripts/build-tgcalls.sh', 'scripts/build-ffmpeg.sh', 'native/quill-calls/patches/libvpx-*') }}
      - name: build libquill_calls
        run: bash scripts/build-tgcalls.sh
      - name: save tg_owt and codecs
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/quill-calls/work/deps
          key: quill-calls-deps-${{ matrix.target }}-${{ hashFiles('scripts/build-tgcalls.sh', 'scripts/build-ffmpeg.sh', 'native/quill-calls/patches/libvpx-*') }}
      - name: load the library and read its protocol versions
        env:
          LD_LIBRARY_PATH: vendor/ffmpeg/prefix/lib
        run: |
          lib="vendor/quill-calls/lib/${{ matrix.lib }}"
          python3 - "$lib" <<'EOF'
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          lib.qc_api_version.restype = ctypes.c_uint32
          lib.qc_library_versions.restype = ctypes.c_char_p
          lib.qc_max_layer.restype = ctypes.c_int32
          versions = lib.qc_library_versions().decode().split("\n")
          print("api", lib.qc_api_version(), "max layer", lib.qc_max_layer(), "versions", versions)
          assert lib.qc_api_version() == 4
          assert lib.qc_max_layer() >= 92, "tgcalls max layer"
          assert len(versions) >= 3 and all(versions), "tgcalls registered no protocol versions"
          EOF
      - name: exported symbols are only the C API
        run: |
          syms="$(nm -D --defined-only vendor/quill-calls/lib/${{ matrix.lib }} | awk '{print $NF}')"
          other="$(echo "$syms" | grep -v -E '^_?qc_' || true)"
          if [[ -n "$other" ]]; then echo "$other" | head -20; echo 'error: symbols other than qc_* are exported' >&2; exit 1; fi
          echo "$syms"
      - name: the Rust bindings against the library
        run: |
          export LD_LIBRARY_PATH="$PWD/vendor/ffmpeg/prefix/lib"
          cargo test -p quill-calls-sys --locked
      - name: the 1:1 engine against the library
        run: |
          export LD_LIBRARY_PATH="$PWD/vendor/ffmpeg/prefix/lib"
          export QUILL_CALLS_LIB="$PWD/vendor/quill-calls/lib/${{ matrix.lib }}"
          cargo test --no-default-features --lib --locked calls::engine::tgcalls
      - uses: actions/upload-artifact@v7
        with:
          name: quill-calls-${{ matrix.target }}
          overwrite: true
          retention-days: 3
          path: |
            vendor/quill-calls/lib/
            vendor/quill-calls/include/
            vendor/quill-calls/share/
          if-no-files-found: error

  linux-package:
    name: linux-package (${{ matrix.arch }})
    needs: [prepare, calls]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          # target/ includes dep-info containing compile-time env values.
          save-if: false
      - name: apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gperf git patchelf pkg-config curl unzip file \
            zlib1g-dev libssl-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libxcb-xkb-dev libfontconfig-dev \
            libfreetype-dev libasound2-dev libpulse-dev libvulkan-dev libdbus-1-dev libclang-dev nasm \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - name: restore TDLib build
        id: tdlib-cache
        uses: actions/cache/restore@v6
        with:
          path: native/prefix
          key: tdlib-linux-${{ runner.arch }}-${{ hashFiles('src/pins.rs', 'scripts/build-tdlib.sh', 'native/patches/*') }}
      - name: build TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        env:
          TDLIB_BUILD_TARGET: tdjson tdjson_static
        run: bash scripts/build-tdlib.sh
      - name: save TDLib build
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: native/prefix
          key: tdlib-linux-${{ runner.arch }}-${{ hashFiles('src/pins.rs', 'scripts/build-tdlib.sh', 'native/patches/*') }}
      - name: restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: vendor/ffmpeg/prefix
          key: ffmpeg-linux-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'native/quillvideo/*') }}
      - name: build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh
      - name: save FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/ffmpeg/prefix
          key: ffmpeg-linux-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'native/quillvideo/*') }}
      - name: BGRA picture layout against the built swscale
        run: bash scripts/test-bgra-layout.sh
      - name: decoder tests against the built FFmpeg
        run: QUILL_REQUIRE_VIDEO_LIB=1 QUILL_VIDEO_LIB="$PWD/vendor/ffmpeg/prefix/lib/libquillvideo.so" cargo test --no-default-features --locked --lib video_decode -- --nocapture
      - name: hub tests against the built TDLib
        run: QUILL_TDJSON_PATH="$PWD/native/prefix/lib/libtdjson.so" QUILL_TEST_HUB_EXIT_RUNS=50 cargo test --no-default-features --locked --lib -- --ignored --nocapture blocked_receive live_exit
      - name: download libquill_calls
        uses: actions/download-artifact@v8
        with:
          name: quill-calls-linux-${{ matrix.arch }}
          path: vendor/quill-calls
      - name: build release ui
        env:
          QUILL_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          QUILL_BUILD_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          QUILL_BUILD_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: cargo build --release --features ui --locked
      - name: build mini-app helper (WebKitGTK)
        run: cargo build --release --locked -p quill-webview
      - name: package
        run: bash scripts/linux-package.sh
      - name: check package (ELF dependencies)
        run: bash scripts/check-bundle-elf.sh dist/linux/quill-linux-${{ matrix.arch }}
      - name: checker negative test (unbundled OpenSSL must fail)
        run: |
          cp -a dist/linux/quill-linux-${{ matrix.arch }} "$RUNNER_TEMP/neg"
          rm "$RUNNER_TEMP/neg/lib/libssl.so.3"
          if bash scripts/check-bundle-elf.sh "$RUNNER_TEMP/neg"; then echo 'checker accepted a package missing libssl' >&2; exit 1; fi
      - name: run from package (no env vars)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          env -u LD_LIBRARY_PATH -u QUILL_TDJSON_PATH dist/linux/quill-linux-${{ matrix.arch }}/quill --version
          test "$(env -u LD_LIBRARY_PATH -u QUILL_TDJSON_PATH dist/linux/quill-linux-${{ matrix.arch }}/quill --version)" = "Quill $VERSION"
          test "$(dist/linux/quill-linux-${{ matrix.arch }}/quill --build-info)" = ui
          python3 scripts/check-bundle-dlopen.py dist/linux/quill-linux-${{ matrix.arch }}
          env -u LD_LIBRARY_PATH dist/linux/quill-linux-${{ matrix.arch }}/quill --video-probe tests/fixtures/clip-h264-aac.mp4
          env -u LD_LIBRARY_PATH dist/linux/quill-linux-${{ matrix.arch }}/quill --video-probe tests/fixtures/clip-vp9.webm
      - name: Require embedded credentials in the packaged app
        run: |
          test "$(dist/linux/quill-linux-${{ matrix.arch }}/quill --embedded-credentials)" = embedded
      - name: smoke the extracted tarball
        run: |
          mkdir -p "$RUNNER_TEMP/extract"
          tar -C "$RUNNER_TEMP/extract" -xzf dist/linux/quill-linux-${{ matrix.arch }}-bundle.tar.gz
          "$RUNNER_TEMP/extract/quill-linux-${{ matrix.arch }}/quill" --version
          bash "$RUNNER_TEMP/extract/quill-linux-${{ matrix.arch }}/install.sh" "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/quill" --version
          bash scripts/check-ffmpeg-tools.sh "$RUNNER_TEMP/extract/quill-linux-${{ matrix.arch }}" \
            --expect-encoder mpeg4 --expect-encoder aac --expect-encoder mjpeg --expect-encoder png
          grep -q "^Exec=$RUNNER_TEMP/prefix/opt/quill/quill" "$RUNNER_TEMP/prefix/share/applications/org.shinycake.quill.desktop"
          grep -qx "Exec=$RUNNER_TEMP/prefix/opt/quill/quill --quit" "$RUNNER_TEMP/prefix/share/applications/org.shinycake.quill.desktop"
      - name: Installed app reaches live Telegram authorization without runtime credentials
        shell: bash
        run: |
          set -euo pipefail
          smoke_home="$(mktemp -d)"
          trap 'rm -rf "$smoke_home"' EXIT
          app="$RUNNER_TEMP/prefix/opt/quill"
          result="$(cd "$smoke_home" && env -u TELEGRAM_API_ID -u TELEGRAM_API_HASH \
            -u QUILL_API_ID -u QUILL_API_HASH -u CARGO_MANIFEST_DIR -u LD_LIBRARY_PATH \
            HOME="$smoke_home" XDG_DATA_HOME="$smoke_home/data" \
            QUILL_TDJSON_PATH="$app/lib/libtdjson.so" "$app/quill" --connect-smoke)"
          echo "$result"
          test "$result" = 'SMOKE_OK wait-phone'
      - name: updater binary
        run: |
          mkdir -p dist/update
          cp dist/linux/quill-linux-${{ matrix.arch }}/quill dist/update/quill-linux-${{ matrix.arch }}
          test "$(dist/update/quill-linux-${{ matrix.arch }} --release-asset-name)" = quill-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: quill-linux-${{ matrix.arch }}-bundle
          overwrite: true
          retention-days: 3
          path: |
            dist/linux/quill-linux-${{ matrix.arch }}-bundle.tar.gz
            dist/linux/quill-linux-${{ matrix.arch }}-bundle.tar.gz.sha256
            dist/update/quill-linux-${{ matrix.arch }}
          if-no-files-found: error

  flatpak:
    name: flatpak (${{ matrix.arch }})
    needs: [prepare, linux-package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      APP_ID: io.github.shinycake.Quill
      MANIFEST: packaging/flatpak/ci.yml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: quill-linux-x86_64-bundle
          path: in/linux-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: quill-linux-aarch64-bundle
          path: in/linux-aarch64
      - name: Verify both current-run bundles and prepare local manifest
        run: |
          set -euo pipefail
          mkdir -p packaging/flatpak/_release
          for arch in x86_64 aarch64; do
            file="quill-linux-$arch-bundle.tar.gz"
            cd "in/linux-$arch/linux"
            test -s "$file"
            test "$(sha256sum "$file")" = "$(tr -d '\r\n' < "$file.sha256")"
            cd "$GITHUB_WORKSPACE"
            cp "in/linux-$arch/linux/$file" packaging/flatpak/_release/
          done
          bash packaging/flatpak/bump.sh --local packaging/flatpak/_release packaging/flatpak/ci.yml
      - name: Validate the metainfo
        run: appstreamcli validate --strict --explain "assets/linux/$APP_ID.metainfo.xml"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: ${{ env.MANIFEST }}
          arch: ${{ matrix.arch }}
          bundle: quill-linux-${{ matrix.arch }}.flatpak
          upload-artifact: false
          # The build directory contains the packaged binary and may contain credentials.
          cache: false
          restore-cache: false
          save-cache: false
      - name: Install flatpak-builder-lint
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
      - name: Lint the manifest
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            --exceptions --user-exceptions packaging/flatpak/lint-exceptions.json manifest "$MANIFEST"
      - name: Lint the build
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            --exceptions --user-exceptions packaging/flatpak/lint-exceptions.json repo repo
      - name: Install the build
        run: |
          flatpak remote-add --user --no-gpg-verify --if-not-exists quill-ci "$PWD/repo"
          flatpak install --user -y --noninteractive quill-ci "$APP_ID"
          exports="$HOME/.local/share/flatpak/exports/share"
          test -f "$exports/applications/$APP_ID.desktop"
          grep -qx 'MimeType=x-scheme-handler/tg;' "$exports/applications/$APP_ID.desktop"
          test -f "$exports/icons/hicolor/512x512/apps/$APP_ID.png"
      - name: Smoke test inside the sandbox
        run: |
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR
          run() { dbus-run-session -- flatpak run "$@"; }
          run --command=quill "$APP_ID" --version
          run --command=sh "$APP_ID" -c '
            cd /app/lib/quill && ldd quill quill-webview ffmpeg ffprobe lib/*.so*' | tee ldd.txt
          if grep -n 'not found' ldd.txt; then echo '::error::a library is missing inside the Flatpak'; exit 1; fi
          run --command=sh "$APP_ID" -c 'readlink -f /app/bin/quill' | grep -qx /app/lib/quill/quill
      - uses: actions/upload-artifact@v7
        with:
          name: quill-flatpak-${{ matrix.arch }}
          overwrite: true
          retention-days: 3
          path: quill-linux-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  linux-distro-packages:
    needs: [prepare, linux-package]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: quill-linux-x86_64-bundle
          path: in/linux-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: quill-linux-aarch64-bundle
          path: in/linux-aarch64
      - name: Verify both current-run bundles
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            file="quill-linux-$arch-bundle.tar.gz"
            cd "in/linux-$arch/linux"
            test -s "$file"
            test "$(sha256sum "$file")" = "$(tr -d '\r\n' < "$file.sha256")"
            cd "$GITHUB_WORKSPACE"
          done
      - name: Build and test distribution packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bash packaging/linux/package.sh \
            in/linux-x86_64/linux/quill-linux-x86_64-bundle.tar.gz \
            in/linux-aarch64/linux/quill-linux-aarch64-bundle.tar.gz "$VERSION" dist/distro
          bash packaging/linux/test-packages.sh dist/distro
          python3 - <<'PY'
          from pathlib import Path
          d = Path('dist/distro')
          expected = {'quill-linux-x86_64.deb', 'quill-linux-x86_64-fedora.rpm',
                      'quill-linux-x86_64-opensuse.rpm', 'quill-linux-x86_64.pkg.tar.zst'}
          actual = {p.name for p in d.iterdir()}
          if actual != expected or any(not (d / n).is_file() or (d / n).is_symlink() or not (d / n).stat().st_size for n in expected):
              raise SystemExit(f'Unexpected distro packages: {sorted(actual)}')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: quill-linux-distro-packages
          overwrite: true
          retention-days: 3
          path: dist/distro/
          if-no-files-found: error

  sources:
    name: lgpl-sources
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: archive LGPL sources
        run: bash scripts/release-lgpl-sources.sh dist/sources
      - uses: actions/upload-artifact@v7
        with:
          name: quill-lgpl-sources
          overwrite: true
          retention-days: 3
          path: dist/sources/*
          if-no-files-found: error

  release:
    name: verify and publish GitHub Release
    needs: [prepare, linux-checks, calls, linux-package, flatpak, linux-distro-packages, sources]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: quill-linux-x86_64-bundle
          path: in/linux-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: quill-linux-aarch64-bundle
          path: in/linux-aarch64
      - uses: actions/download-artifact@v8
        with:
          name: quill-flatpak-x86_64
          path: in/flatpak-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: quill-flatpak-aarch64
          path: in/flatpak-aarch64
      - uses: actions/download-artifact@v8
        with:
          name: quill-linux-distro-packages
          path: in/distro
      - uses: actions/download-artifact@v8
        with:
          name: quill-lgpl-sources
          path: in/sources
      - name: Verify producer checksums and collect release files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p release-out
          for f in in/linux-x86_64/linux/quill-linux-x86_64-bundle.tar.gz \
                   in/linux-aarch64/linux/quill-linux-aarch64-bundle.tar.gz; do
            dir="$(dirname "$f")"; name="$(basename "$f")"
            (cd "$dir" && test -s "$name" && test "$(sha256sum "$name")" = "$(tr -d '\r\n' < "$name.sha256")")
            cp "$f" release-out/
          done
          for arch in x86_64 aarch64; do
            binary="in/linux-$arch/update/quill-linux-$arch"
            test -s "$binary"
            # Ensure the updater asset is exactly the patched binary in the tarball.
            actual="$(sha256sum "$binary" | cut -d' ' -f1)"
            bundled="$(tar -xzOf "release-out/quill-linux-$arch-bundle.tar.gz" "quill-linux-$arch/quill" | sha256sum | cut -d' ' -f1)"
            test "$actual" = "$bundled"
            cp "$binary" release-out/
            cp "in/flatpak-$arch/quill-linux-$arch.flatpak" release-out/
          done
          cp in/distro/* in/sources/* release-out/
      - name: Check exact asset set and pinned source archives
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          def pin(path, pattern):
              matches = re.findall(pattern, Path(path).read_text(), re.M)
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one pin in {path}: {pattern}')
              return matches[0]
          ffmpeg = pin('scripts/build-ffmpeg.sh', r'^TAG=(n[0-9.]+)$')
          pin('scripts/build-ffmpeg.sh', r'^COMMIT=([0-9a-f]{40})$')
          tgcalls = pin('scripts/build-tgcalls.sh', r'^TGCALLS_COMMIT=([0-9a-f]{40})$')
          expected = {
              'quill-linux-x86_64-bundle.tar.gz', 'quill-linux-aarch64-bundle.tar.gz',
              'quill-linux-x86_64', 'quill-linux-aarch64',
              'quill-linux-x86_64.flatpak', 'quill-linux-aarch64.flatpak',
              'quill-linux-x86_64.deb', 'quill-linux-x86_64-fedora.rpm',
              'quill-linux-x86_64-opensuse.rpm', 'quill-linux-x86_64.pkg.tar.zst',
              'LGPL-SOURCES.txt', f'quill-source-ffmpeg-{ffmpeg}.tar.xz',
              f'quill-source-tgcalls-{tgcalls[:8]}.tar.xz',
          }
          root = Path('release-out')
          actual = {p.name for p in root.iterdir()}
          if actual != expected:
              raise SystemExit(f'Wrong assets: missing={sorted(expected - actual)}, extra={sorted(actual - expected)}')
          for name in expected:
              p = root / name
              if p.is_symlink() or not p.is_file() or not p.stat().st_size:
                  raise SystemExit(f'Not a nonempty regular file: {p}')
          Path('expected-assets.json').write_text(json.dumps(sorted(expected | {'SHA256SUMS.txt'})))
          PY
      - name: Find previous reachable release tag
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          git tag --merged "$GITHUB_SHA" --list 'v*' > "$RUNNER_TEMP/reachable-tags"
          python3 - "$RUNNER_TEMP/reachable-tags" >> "$GITHUB_OUTPUT" <<'PY'
          import os, re, subprocess, sys
          version = tuple(map(int, os.environ['VERSION'].split('.')))
          candidates = []
          for tag in open(sys.argv[1], encoding='utf-8'):
              tag = tag.strip()
              if re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
                  parsed = tuple(map(int, tag[1:].split('.')))
                  commit = subprocess.check_output(['git', 'rev-list', '-n', '1', tag], text=True).strip()
                  if parsed < version and commit != os.environ['GITHUB_SHA']:
                      candidates.append((parsed, tag))
          print('tag=' + (max(candidates)[1] if candidates else ''))
          PY
      - name: Generate exact checksums and release notes
        env:
          PREV: ${{ steps.previous.outputs.tag }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PREV" ]]; then
            base="$PREV"
          elif [[ "$BEFORE" =~ ^0{40}$ ]]; then
            base=''
          else
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE"
            fi
            git cat-file -e "$BEFORE^{commit}"
            base="$BEFORE"
          fi
          export BASE="$base"
          python3 - <<'PY'
          import hashlib, html, json, os, subprocess
          from pathlib import Path
          from urllib.parse import quote
          root = Path('release-out')
          names = json.loads(Path('expected-assets.json').read_text())
          actual = {p.name for p in root.iterdir()}
          expected = set(names) - {'SHA256SUMS.txt'}
          if actual != expected:
              raise SystemExit(f'Wrong assets: {sorted(actual ^ expected)}')
          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          for name in expected:
              p = root / name
              if p.is_symlink() or not p.is_file() or not p.stat().st_size:
                  raise SystemExit(f'Not a nonempty regular file: {p}')
          sums = ''.join(f'{digest(root / n)}  {n}\n' for n in names if n != 'SHA256SUMS.txt')
          (root / 'SHA256SUMS.txt').write_text(sums, encoding='ascii')
          sha, tag, base = (os.environ[x] for x in ('GITHUB_SHA', 'TAG', 'BASE'))
          url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          subject = subprocess.check_output(['git', 'show', '-s', '--format=%s', sha], text=True).strip()
          revision_range = f'{base}..{sha}' if base else sha
          log = subprocess.check_output(['git', 'log', '--reverse', '-z', '--format=%H%x00%s', revision_range], text=True)
          fields = log.split('\0')
          if fields[-1] == '':
              fields.pop()
          if len(fields) % 2:
              raise SystemExit('Unexpected git log output')
          lines = [f'Commit: [{sha}]({url}/commit/{sha}) {html.escape(subject)}', '',
                   f'New commits: {len(fields) // 2}', '']
          for commit, message in zip(fields[::2], fields[1::2]):
              lines.append(f'- [{commit[:12]}]({url}/commit/{commit}) {html.escape(message)}')
          if base:
              lines += ['', f'[Compare {base}...{sha}]({url}/compare/{quote(base)}...{sha})']
          else:
              lines += ['', f'[Commit history]({url}/commits/{sha})']
          lines += ['', f'## Release assets ({len(names)})', '']
          lines += [f'- [`{n}`]({url}/releases/download/{quote(tag)}/{quote(n)})' for n in names]
          lines += ['', 'Flatpak bundles are installed and updated manually. The standalone Linux binaries require the libraries and helpers in their matching bundles.']
          text = '\n'.join(lines) + '\n'
          if len(text) > 125000:
              raise SystemExit('Release notes exceed GitHub limit')
          Path('release-notes.md').write_text(text, encoding='utf-8')
          print(f'Checked {len(names)} assets and {len(names)-1} SHA256SUMS entries')
          PY
      # Do not create a tag or a draft until every local file, checksum and note
      # above has been checked. Never mistake a network/API error for absence.
      - name: Create or update this repository's release
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --refs origin "refs/tags/$TAG" > "$RUNNER_TEMP/release-tag"
          if [[ ! -s "$RUNNER_TEMP/release-tag" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          git fetch --no-tags origin "refs/tags/$TAG"
          actual="$(git rev-parse 'FETCH_HEAD^{commit}')"
          [[ "$actual" == "$GITHUB_SHA" ]] || { echo "::error::$TAG points to $actual, not $GITHUB_SHA"; exit 1; }
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          id="$(python3 - "$RUNNER_TEMP/releases.json" <<'PY'
          import json, os, sys
          releases = [r for page in json.load(open(sys.argv[1])) for r in page]
          found = [r for r in releases if r['tag_name'] == os.environ['TAG']]
          if len(found) > 1:
              raise SystemExit('Multiple releases for this tag')
          print(found[0]['id'] if found else '')
          PY
          )"
          if [[ -z "$id" ]]; then
            id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="$TAG" -F body=@release-notes.md \
              -F draft=true --jq .id)"
          fi
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "RELEASE_ID=$id" >> "$GITHUB_ENV"
      - name: Reconcile release assets, then verify uploaded bytes
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
          python3 - "$RUNNER_TEMP/assets.json" "$RUNNER_TEMP" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          pages, temp = sys.argv[1], Path(sys.argv[2])
          names = json.loads(Path('expected-assets.json').read_text())
          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return 'sha256:' + h.hexdigest()
          assets = [a for page in json.load(open(pages)) for a in page]
          if len({a['name'] for a in assets}) != len(assets):
              raise SystemExit('Duplicate remote asset names')
          by_name = {a['name']: a for a in assets}
          unexpected = [a['name'] for a in assets if a['name'] not in names]
          if unexpected:
              raise SystemExit(f'Existing release has unexpected assets: {unexpected}')
          upload = []
          for name in names:
              path = Path('release-out') / name
              asset = by_name.get(name)
              if not asset or asset.get('state') != 'uploaded' or asset.get('size') != path.stat().st_size or asset.get('digest') != digest(path):
                  upload.append(name)
          (temp / 'upload-assets').write_text(''.join(x + '\n' for x in upload))
          PY
          while IFS= read -r name; do
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "release-out/$name"
          done < "$RUNNER_TEMP/upload-assets"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/assets-final.json"
          python3 - "$RUNNER_TEMP/assets-final.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          assets = [a for page in json.load(open(sys.argv[1])) for a in page]
          names = json.loads(Path('expected-assets.json').read_text())
          if len(assets) != len(names) or {a['name'] for a in assets} != set(names):
              raise SystemExit('Uploaded release asset set differs from expected')
          for a in assets:
              p = Path('release-out') / a['name']
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              if a.get('state') != 'uploaded' or a.get('size') != p.stat().st_size or a.get('digest') != 'sha256:' + h.hexdigest():
                  raise SystemExit(f"Uploaded asset does not match: {a['name']}")
          print(f'Verified {len(assets)} remote asset sizes and SHA-256 digests')
          PY
      - name: Publish without promoting an older release to latest
        shell: bash
        run: |
          set -euo pipefail
          # Recheck the remote tag immediately before publishing, including on reruns.
          git fetch --no-tags origin "refs/tags/$TAG"
          actual="$(git rev-parse 'FETCH_HEAD^{commit}')"
          [[ "$actual" == "$GITHUB_SHA" ]] || { echo "::error::$TAG moved to $actual"; exit 1; }
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases-final.json"
          latest="$(python3 - "$RUNNER_TEMP/releases-final.json" <<'PY'
          import json, os, re, sys
          current = tuple(map(int, os.environ['VERSION'].split('.')))
          releases = [r for page in json.load(open(sys.argv[1])) for r in page]
          for release in releases:
              if release['draft'] or release['prerelease'] or release['tag_name'] == os.environ['TAG']:
                  continue
              tag = release['tag_name']
              if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
                  print('false')  # An unfamiliar stable release: do not risk promoting this one.
                  break
              if tuple(map(int, tag[1:].split('.'))) > current:
                  print('false')
                  break
          else:
              print('true')
          PY
          )"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f name="$TAG" -F body=@release-notes.md \
            -F draft=false -F prerelease=false -f make_latest="$latest" >/dev/null
          echo "Published $TAG from $GITHUB_SHA (make_latest=$latest)" >> "$GITHUB_STEP_SUMMARY"
