# Builds the Flatpak manifest (packaging/flatpak) in the Flatpak build
# container, lints it with flatpak-builder-lint, and checks the installed app
# starts and finds every library. Pull requests build the release the
# manifest names; a published release builds that new release, attaches
# the bundles to it (quill-linux-<arch>.flatpak) and rebuilds the site,
# which serves them as Quill's own Flatpak repo (scripts/site-flatpak-repo.sh).
# A manual run with a tag does the same for that release.
name: flatpak

on:
  pull_request:
    paths:
      - packaging/flatpak/**
      - assets/linux/**
      - docs/screenshots/flatpak/**
      - .github/workflows/flatpak.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release to build and attach the bundles to (vYEAR.MONTHDAY.COMMITS); empty builds main's manifest
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      # bubblewrap needs it to build and run the sandbox.
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      APP_ID: io.github.shinycake.Quill
      MANIFEST: packaging/flatpak/io.github.shinycake.Quill.yml
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Point the manifest at this release
        if: env.TAG != ''
        run: bash packaging/flatpak/bump.sh "$TAG"

      # Screenshots are linked from main, so a pull request that adds or
      # changes one cannot reach it yet: pull requests skip the URL check.
      # The build lint always skips the screenshot errors that only
      # a hosted screenshot mirror can satisfy.
      - name: Validate the metainfo
        run: |
          net=()
          [[ "${{ github.event_name }}" == pull_request ]] && net=(--no-net)
          appstreamcli validate --strict "${net[@]}" --explain "assets/linux/$APP_ID.metainfo.xml"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: ${{ env.MANIFEST }}
          arch: ${{ matrix.arch }}
          bundle: quill-linux-${{ matrix.arch }}.flatpak
          upload-artifact: ${{ github.event_name != 'pull_request' }}
          artifact-name: quill-flatpak-${{ matrix.arch }}

      - name: Install flatpak-builder-lint
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder

      - name: Lint the manifest
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest "$MANIFEST"

      - name: Lint the build
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            --exceptions --user-exceptions packaging/flatpak/lint-exceptions.json repo repo

      - name: Install the build
        run: |
          flatpak remote-add --user --no-gpg-verify --if-not-exists quill-ci "$PWD/repo"
          flatpak install --user -y --noninteractive quill-ci "$APP_ID"
          exports="$HOME/.local/share/flatpak/exports/share"
          test -f "$exports/applications/$APP_ID.desktop"
          grep -qx "MimeType=x-scheme-handler/tg;" "$exports/applications/$APP_ID.desktop"
          test -f "$exports/icons/hicolor/512x512/apps/$APP_ID.png"

      - name: Smoke test inside the sandbox
        run: |
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR
          run() { dbus-run-session -- flatpak run "$@"; }
          run --command=quill "$APP_ID" --version
          run --command=sh "$APP_ID" -c '
            cd /app/lib/quill && ldd quill quill-webview ffmpeg ffprobe lib/*.so*' | tee ldd.txt
          if grep -n "not found" ldd.txt; then
            echo "::error::a library is missing inside the Flatpak"
            exit 1
          fi
          # Quill finds its helpers beside its real path, not /app/bin.
          run --command=sh "$APP_ID" -c 'readlink -f /app/bin/quill' | grep -qx /app/lib/quill/quill

  publish:
    name: attach the bundles and rebuild the site's Flatpak repo
    needs: flatpak
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: quill-flatpak-*
          merge-multiple: true
      - name: Attach the bundles to the release
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" quill-linux-x86_64.flatpak quill-linux-aarch64.flatpak --clobber
      - name: Rebuild the site
        run: gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=site-refresh
