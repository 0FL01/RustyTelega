name: release-published
# Hook for the product page (built separately under /site, deployed to GitHub
# Pages): when the owner publishes a release, emit a repository_dispatch event
# of type "site-refresh" so the Pages workflow can rebuild from the GitHub API
# and the release's latest.json. Repository dispatches sent with GITHUB_TOKEN
# do start workflows (unlike most GITHUB_TOKEN events).
# docs/decisions/codex-release-pipeline.md
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-refresh:
    name: site-refresh
    runs-on: ubuntu-latest
    permissions:
      # POST /repos/{owner}/{repo}/dispatches needs contents: write.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || '' }}
      URL: ${{ github.event.release.html_url || '' }}
    steps:
      - name: emit site-refresh
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=site-refresh \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[release_url]=$URL" \
            -f "client_payload[manifest]=https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          echo "site-refresh sent for ${TAG:-manual dispatch}"

  # winget: a pull request to microsoft/winget-pkgs for each stable release,
  # once shinycake.Quill is in winget (the first version went in by hand,
  # packaging/winget/README.md). Needs WINGET_TOKEN, a classic token with
  # public_repo of an account that has a fork of winget-pkgs; skipped without.
  winget:
    name: winget
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: token present
        id: token
        env:
          HAVE: ${{ secrets.WINGET_TOKEN != '' }}
        run: |
          echo "have=$HAVE" >> "$GITHUB_OUTPUT"
          [ "$HAVE" = true ] || echo "::notice::WINGET_TOKEN is not set: winget is not updated for this release"
      - name: submit to winget
        if: steps.token.outputs.have == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: shinycake.Quill
          installers-regex: '-setup\.exe$'
          release-tag: ${{ github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
