name: aur
# The AUR package quill-bin (packaging/aur/): written for a published
# release, built, installed and run in an Arch Linux container, then pushed to
# aur.archlinux.org when AUR_SSH_KEY is set (a stable release, or a manual run
# with push=true). A pull request that changes the package tests it against
# the latest release. docs/decisions/distribution-channels.md
on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'packaging/aur/**'
      - '.github/workflows/aur.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vYEAR.MONTHDAY.COMMITS); empty for the latest release'
        required: false
        default: ''
      push:
        description: 'Push the package to aur.archlinux.org'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  aur:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: tools
        run: pacman -Syu --noconfirm --needed git openssh python github-cli
      - uses: actions/checkout@v7
      - name: version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [ -n "$TAG" ] || TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: write the package
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          python packaging/aur/make-pkgbuild.py '${{ steps.v.outputs.version }}' /home/builder/quill-bin
          chown -R builder /home/builder/quill-bin
          cd /home/builder/quill-bin
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          cat PKGBUILD
      - name: build, install and run
        run: |
          cd /home/builder/quill-bin
          # mesa provides vulkan-driver, the one virtual dependency.
          pacman -S --noconfirm --needed mesa
          sudo -u builder makepkg --syncdeps --noconfirm
          pacman -U --noconfirm quill-bin-*.pkg.tar.zst
          v="$(quill --version)"
          [ "$v" = 'Quill ${{ steps.v.outputs.version }}' ] || { echo "installed --version: $v"; exit 1; }
          test -f /usr/share/applications/org.shinycake.quill.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/quill.png
          pacman -R --noconfirm quill-bin
          test ! -e /usr/lib/quill
      - name: push
        if: ${{ github.event_name == 'release' || inputs.push }}
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then echo '::notice::AUR_SSH_KEY is not set: the package was tested but not pushed'; exit 0; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'
          git clone ssh://aur@aur.archlinux.org/quill-bin.git aur
          cp /home/builder/quill-bin/PKGBUILD /home/builder/quill-bin/.SRCINFO aur/
          cd aur
          git config user.name 'shinycake'
          git config user.email '20040202+shinycake@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo 'AUR already has this version'; exit 0; fi
          git commit -m 'Update to ${{ steps.v.outputs.version }}'
          git push origin HEAD:master
